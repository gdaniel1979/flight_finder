# Flight Finder beállító webapp az nginx HTTPS szerverblokkjában (/flight-finder/ alútvonal).
#
# A meglévő /etc/nginx/sites-available/my-life fájl "listen 443 ssl" szerverblokkjába,
# a "location / {" sor ELÉ kell beírni ezt az egy sort:
#
#   include /home/gdaniel1979/my_projects/flight_finder_ryanair/deploy/nginx-flight-finder.conf;
#
# A Streamlit a --server.baseUrlPath flight-finder kapcsolóval maga is ezen az útvonalon
# szolgál ki, ezért a proxy_pass-ban nincs útvonal (az előtag változatlanul továbbmegy).

location = /flight-finder {
    return 301 /flight-finder/;
}

location /flight-finder/ {
    proxy_pass http://127.0.0.1:8503;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # A Streamlit websocketen keresztul dolgozik
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 86400;
    proxy_buffering off;
}
